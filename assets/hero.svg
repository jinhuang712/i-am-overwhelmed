<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="I am overwhelmed. A fed-up user's message to their coding agent, with the reply rules highlighted: say it simply, be honest please!, draw it, the same format every time, one thing at a time, say it again, ask me first, stop agreeing with me all the time!." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><clipPath id="c"><rect width="1280" height="640" rx="20"/></clipPath><g clip-path="url(#c)"><rect width="1280" height="640" fill="#F5F7F8"/><text x="62.0" y="64" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1123.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt; round after round and we are still going in circles. IN CIRCLES. every reply</text><text x="62.0" y="100" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1123.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">is longer and messier than the last. I can't tell what is done, what broke, or</text><text x="62.0" y="136" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1094.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">what you are even asking me. you say 'G17' and 'step 4' like I remember what</text><text x="62.0" y="172" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1094.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">those are?! I scrolled up twice and gave up. I have no idea where we are and</text><text x="62.0" y="266" font-size="80" fill="#1C2033" fill-opacity="1" font-weight="700" textLength="816.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I am overwhelmed!</text><text x="62.0" y="324" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1094.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'm tired. I'm doing three other things. I skim. I ALWAYS skim. and you keep</text><text x="62.0" y="360" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1036.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">writing like I have all day?! so this is how you talk to me from now on.</text><rect x="57.0" y="372.0" width="197.2" height="31.7" rx="4" fill="#F4D94E"/><rect x="561.0" y="372.0" width="254.8" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="396" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1137.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say it simply. if something broke, be honest please! I would rather hear it now</text><text x="62.0" y="396" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="187.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say it simply</text><text x="566.0" y="396" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="244.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">be honest please!</text><rect x="676.2" y="408.0" width="110.8" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="432" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="950.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">than find it on friday. if it has a shape, draw it, seriously. use</text><text x="681.2" y="432" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">draw it</text><rect x="57.0" y="444.0" width="384.4" height="31.7" rx="4" fill="#F4D94E"/><rect x="805.8" y="444.0" width="283.6" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="468" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1137.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the same format every time so I know where to look. one thing at a time. ONE. I</text><text x="62.0" y="468" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="374.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the same format every time</text><text x="810.8" y="468" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="273.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">one thing at a time</text><rect x="633.0" y="480.0" width="182.8" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="504" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1065.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">will not remember your last message, so say it again. when only I know the</text><text x="638.0" y="504" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="172.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say it again</text><rect x="172.2" y="516.0" width="182.8" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="540" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1152.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">answer, ask me first, do not pile ten paragraphs on a guess. and when I'm wrong,</text><text x="177.2" y="540" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="172.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ask me first</text><rect x="57.0" y="552.0" width="514.0" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="576" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1051.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">stop agreeing with me all the time! I am not always right. you know that.</text><text x="62.0" y="576" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="504.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">stop agreeing with me all the time!</text><rect x="1127.6" y="553" width="14" height="30" fill="#1C2033"/></g></svg>