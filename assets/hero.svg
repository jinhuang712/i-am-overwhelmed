<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="I am overwhelmed. A fed-up user's message to their coding agent, with the reply rules highlighted: say it simply, never hide it, draw it, the same format every time, one thing at a time, ask me first, push back." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><clipPath id="c"><rect width="1280" height="640" rx="20"/></clipPath><g clip-path="url(#c)"><rect width="1280" height="640" fill="#F5F7F8"/><text x="62.0" y="66" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1123.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt; no. stop. STOP. I asked ONE small question. one. and you sent me forty lines</text><text x="62.0" y="102" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1137.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">again, with five headings, a table I never asked for, three caveats, a recap of</text><text x="62.0" y="138" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1051.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">what I had just said to you, and a list of next steps for a thing I never</text><text x="62.0" y="174" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="777.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">wanted. I have read none of it. I can't. it is 1am and</text><text x="62.0" y="272" font-size="80" fill="#1C2033" fill-opacity="1" font-weight="700" textLength="816.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I am overwhelmed.</text><text x="62.0" y="334" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1094.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'm tired. I'm doing three other things. I skim, I always skim, and you keep</text><text x="62.0" y="370" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1022.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">writing like I have all day. so here is how you talk to me from now on.</text><rect x="57.0" y="382.0" width="197.2" height="31.7" rx="4" fill="#F4D94E"/><rect x="949.8" y="382.0" width="197.2" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="406" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1123.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say it simply. a few lines, not an essay. if something broke, never hide it, I</text><text x="62.0" y="406" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="187.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say it simply</text><text x="954.8" y="406" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="187.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">never hide it</text><rect x="1036.2" y="418.0" width="110.8" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="442" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1123.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">would rather hear it now than find it on friday. if it has a shape, draw it, I</text><text x="1041.2" y="442" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">draw it</text><rect x="618.6" y="454.0" width="384.4" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="478" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1094.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">read a picture faster than a list. use the same format every time, so I know</text><text x="623.6" y="478" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="374.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the same format every time</text><rect x="273.0" y="490.0" width="283.6" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="514" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1137.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">where to look. one thing at a time, and tell me when we drift. when only I know</text><text x="278.0" y="514" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="273.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">one thing at a time</text><rect x="229.8" y="526.0" width="182.8" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="550" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1137.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the answer, ask me first, do not stack ten paragraphs on a guess. and when I am</text><text x="234.8" y="550" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="172.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ask me first</text><rect x="157.8" y="562.0" width="139.6" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="586" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="936.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">wrong, push back. do not just agree with me because I sound sure.</text><text x="162.8" y="586" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="129.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">push back</text><rect x="1012.4" y="563" width="14" height="30" fill="#1C2033"/></g></svg>