<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="I am overwhelmed. A fed-up user's message to their coding agent, with the reply rules highlighted: say it simply, never hide it, draw it, the same format every time, one thing at a time, say it again, ask me first, push back." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"><clipPath id="c"><rect width="1280" height="640" rx="20"/></clipPath><g clip-path="url(#c)"><rect width="1280" height="640" fill="#F5F7F8"/><text x="62.0" y="50" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1123.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt; no. stop. STOP. I asked ONE small question. one. and you sent me forty lines</text><text x="62.0" y="86" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1137.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">again, with five headings, a table I never asked for, three caveats, a recap of</text><text x="62.0" y="122" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1051.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">what I had just said to you, and a list of next steps for a thing I never</text><text x="62.0" y="158" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="777.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">wanted. I have read none of it. I can't. it is 1am and</text><text x="62.0" y="252" font-size="80" fill="#1C2033" fill-opacity="1" font-weight="700" textLength="816.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I am overwhelmed.</text><text x="62.0" y="310" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1094.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I'm tired. I'm doing three other things. I skim, I always skim, and you keep</text><text x="62.0" y="346" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1022.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">writing like I have all day. so here is how you talk to me from now on.</text><rect x="57.0" y="358.0" width="197.2" height="31.7" rx="4" fill="#F4D94E"/><rect x="561.0" y="358.0" width="197.2" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="382" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1094.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say it simply. if something broke, never hide it, I would rather hear it now</text><text x="62.0" y="382" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="187.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say it simply</text><text x="566.0" y="382" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="187.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">never hide it</text><rect x="676.2" y="394.0" width="110.8" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="418" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1152.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">than find it on friday. if it has a shape, draw it, I read a picture faster than</text><text x="681.2" y="418" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">draw it</text><rect x="229.8" y="430.0" width="384.4" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="454" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="921.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">a list. use the same format every time, so I know where to look.</text><text x="234.8" y="454" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="374.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the same format every time</text><rect x="57.0" y="466.0" width="283.6" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="490" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1108.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">one thing at a time, and tell me when we drift. I will not remember your last</text><text x="62.0" y="490" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="273.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">one thing at a time</text><rect x="229.8" y="502.0" width="182.8" height="31.7" rx="4" fill="#F4D94E"/><rect x="849.0" y="502.0" width="182.8" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="526" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1080.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">message, so say it again. when only I know the answer, ask me first, do not</text><text x="234.8" y="526" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="172.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">say it again</text><text x="854.0" y="526" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="172.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ask me first</text><rect x="834.6" y="538.0" width="139.6" height="31.7" rx="4" fill="#F4D94E"/><text x="62.0" y="562" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="1094.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">stack ten paragraphs on a guess. and when I am wrong, push back. do not just</text><text x="839.6" y="562" font-size="24" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="129.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">push back</text><text x="62.0" y="598" font-size="24" fill="#1C2033" fill-opacity="0.38" font-weight="400" textLength="504.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agree with me because I sound sure.</text><rect x="580.4" y="575" width="14" height="30" fill="#1C2033"/></g></svg>