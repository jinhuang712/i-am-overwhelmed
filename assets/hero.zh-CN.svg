<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="我过载了。一位被烦到的用户写给编程 agent 的话，其中的回复规则被划了出来：说简单点、请说实话、画出来、每次都用同一个格式、一次只说一件事、再说一遍、先问我、别老是顺着我说。" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', monospace"><clipPath id="c"><rect width="1280" height="640" rx="20"/></clipPath><g clip-path="url(#c)"><rect width="1280" height="640" fill="#F5F7F8"/><text x="62.0" y="80" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="1153.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt; 一轮又一轮，一直在原地打转。原地打转！！你的回复一条比一条长，一条比一条乱。哪些</text><text x="62.0" y="125" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="1187.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">做完了？哪些出问题了？你到底要我回答什么？我全都看不出来。张口就是「G17」「第4步」，</text><text x="62.0" y="170" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="980.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">我哪还记得那是啥？！往上翻了两回，翻不动了。现在进行到哪了我都不知道，</text><text x="62.0" y="286" font-size="92" fill="#1C2033" fill-opacity="1" font-weight="700" textLength="460.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">我过载了！</text><text x="62.0" y="358" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="1148.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">我很累，手上还压着三件别的事。你写的东西我从来只扫一眼，从来！你倒好，写得跟我有一</text><text x="62.0" y="403" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="588.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">整天闲工夫似的？！以后跟我说话就照这个来：</text><rect x="645.0" y="375.6" width="122.0" height="38.1" rx="4" fill="#F4D94E"/><text x="650.0" y="403" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="112.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">说简单点</text><text x="762.0" y="403" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">。出了岔子，</text><rect x="925.0" y="375.6" width="150.0" height="38.1" rx="4" fill="#F4D94E"/><text x="930.0" y="403" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="140.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">请说实话！</text><text x="1070.0" y="403" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">早点告诉我，</text><text x="62.0" y="448" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="448.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">别等到周五让我自己撞上。能画的，</text><rect x="505.0" y="420.6" width="94.0" height="38.1" rx="4" fill="#F4D94E"/><text x="510.0" y="448" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">画出来</text><text x="594.0" y="448" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">，算我求你。</text><rect x="757.0" y="420.6" width="262.0" height="38.1" rx="4" fill="#F4D94E"/><text x="762.0" y="448" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">每次都用同一个格式</text><text x="1014.0" y="448" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="196.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">，我一眼就知道</text><text x="62.0" y="493" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="112.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">该看哪。</text><rect x="169.0" y="465.6" width="206.0" height="38.1" rx="4" fill="#F4D94E"/><text x="174.0" y="493" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="196.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">一次只说一件事</text><text x="370.0" y="493" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="560.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">。就一件！你上一条说了啥我转头就忘，所以</text><rect x="925.0" y="465.6" width="122.0" height="38.1" rx="4" fill="#F4D94E"/><text x="930.0" y="493" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="112.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">再说一遍</text><text x="1042.0" y="493" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">。只有我知道</text><text x="62.0" y="538" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">的事，</text><rect x="141.0" y="510.6" width="94.0" height="38.1" rx="4" fill="#F4D94E"/><text x="146.0" y="538" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">先问我</text><text x="230.0" y="538" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="728.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">，别自己瞎猜完再往上码十段。还有，我说错了你就直说，</text><rect x="953.0" y="510.6" width="234.0" height="38.1" rx="4" fill="#F4D94E"/><text x="958.0" y="538" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="224.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">别老是顺着我说！</text><text x="1182.0" y="538" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="28.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">我</text><text x="62.0" y="583" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="420.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">又不是回回都对，这你心里清楚。</text><rect x="492.0" y="557" width="16" height="34" fill="#1C2033"/></g></svg>