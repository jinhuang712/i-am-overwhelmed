<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="我过载了。一位被烦到的用户写给编程 agent 的话，其中的回复规则被划了出来：说简单点、请说实话、画出来、每次都用同一个格式、一次只说一件事、再说一遍、先问我、别老是顺着我说。" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', monospace"><clipPath id="c"><rect width="1280" height="640" rx="20"/></clipPath><g clip-path="url(#c)"><rect width="1280" height="640" fill="#F5F7F8"/><text x="62.0" y="74" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="1153.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt; 我们已经搞了好几个小时了。好几个小时！！每一条回复都比上一条更长、更乱。我已经分</text><text x="62.0" y="119" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="1136.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">不清哪些做完了、哪些坏了、你到底在问我什么。你张口就是「G17」「第 4 步」，好像我</text><text x="62.0" y="164" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="1008.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">还记得那是什么一样？！我往上翻了两次，放弃了。我完全不知道我们现在在哪，</text><text x="62.0" y="268" font-size="88" fill="#1C2033" fill-opacity="1" font-weight="700" textLength="440.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">我过载了。</text><text x="62.0" y="330" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="1148.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">我很累。我手上还有三件别的事。我只扫一眼，我永远只扫一眼，你却还在写得好像我有一整</text><text x="62.0" y="375" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="476.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">天时间？！从现在起你这样跟我说话：</text><rect x="533.0" y="347.6" width="122.0" height="38.1" rx="4" fill="#F4D94E"/><text x="538.0" y="375" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="112.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">说简单点</text><text x="650.0" y="375" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">。出了问题，</text><rect x="813.0" y="347.6" width="150.0" height="38.1" rx="4" fill="#F4D94E"/><text x="818.0" y="375" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="140.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">请说实话！</text><text x="958.0" y="375" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">我宁愿现在就知道，</text><text x="62.0" y="420" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="448.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">也不要周五才发现。有形状的东西，</text><rect x="505.0" y="392.6" width="94.0" height="38.1" rx="4" fill="#F4D94E"/><text x="510.0" y="420" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">画出来</text><text x="594.0" y="420" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="140.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">，求你了。</text><rect x="729.0" y="392.6" width="262.0" height="38.1" rx="4" fill="#F4D94E"/><text x="734.0" y="420" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">每次都用同一个格式</text><text x="986.0" y="420" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">，我才知道该看哪。</text><rect x="57.0" y="437.6" width="206.0" height="38.1" rx="4" fill="#F4D94E"/><text x="62.0" y="465" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="196.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">一次只说一件事</text><text x="258.0" y="465" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="560.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">。一件！我不会记得你上一条说了什么，所以</text><rect x="813.0" y="437.6" width="122.0" height="38.1" rx="4" fill="#F4D94E"/><text x="818.0" y="465" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="112.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">再说一遍</text><text x="930.0" y="465" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="280.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">。只有我才知道的事，</text><rect x="57.0" y="482.6" width="94.0" height="38.1" rx="4" fill="#F4D94E"/><text x="62.0" y="510" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">先问我</text><text x="146.0" y="510" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="616.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">，别在一个猜测上堆十段话。还有，我错的时候，</text><rect x="757.0" y="482.6" width="234.0" height="38.1" rx="4" fill="#F4D94E"/><text x="762.0" y="510" font-size="28" fill="#1C2033" fill-opacity="1" font-weight="600" textLength="224.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">别老是顺着我说！</text><text x="986.0" y="510" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="224.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">我不是每次都对，</text><text x="62.0" y="555" font-size="28" fill="#1C2033" fill-opacity="0.42" font-weight="400" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">你明明知道。</text><rect x="240.0" y="529" width="16" height="34" fill="#1C2033"/></g></svg>